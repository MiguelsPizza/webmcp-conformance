name: Docs

# Builds browsable HTML docs for the model with doc-gen4 (docbuild/), uploads them as a workflow
# artifact, and publishes them to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install elan and the toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
      # doc-gen4 and its dependencies take most of the build; they only change with the manifest.
      - uses: actions/cache@v4
        with:
          path: |
            docbuild/.lake
            .lake
          key: docs-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: docs-${{ hashFiles('lean-toolchain', 'docbuild/lean-toolchain', 'docbuild/lakefile.toml', 'docbuild/lake-manifest.json') }}-
      - name: Build docs
        working-directory: docbuild
        run: lake build WebMCP:docs
      # Also kept as a run artifact: download it and open index.html.
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docbuild/.lake/build/doc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docbuild/.lake/build/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
