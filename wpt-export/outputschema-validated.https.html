<!DOCTYPE html>
<html>
<head>
<title>WebMCP: registerTool() rejects with TypeError when outputSchema can't be serialized to JSON, as it does for inputSchema.</title>
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#dom-modelcontext-registertool">
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#serialize-a-tool-schema">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Generated by tools/export-wpt.cjs from repros/outputschema-validated.json (webmcp-conformance). The expected
// outcomes are those of its Lean model of the spec, at spec commit 14b6d53.
promise_test(async (t) => {
  const controllers = new Map();
  const controller = (n) => {
    if (!controllers.has(n)) controllers.set(n, new AbortController());
    return controllers.get(n);
  };
  const cyclic = () => { const o = {}; o.self = o; return o; };
  t.add_cleanup(() => { for (const c of controllers.values()) c.abort(); });

  // 1. register: the model says err:TypeError
  await promise_rejects_js(t, TypeError, document.modelContext.registerTool({ name: "a", description: "d", outputSchema: cyclic(), execute: async (input) => input }));

  // 2. getTools: the model says tools:
  const tools0 = await document.modelContext.getTools();
  assert_equals(tools0.length, 0, 'getTools() returns 0 tools');
}, "registerTool() rejects with TypeError when outputSchema can't be serialized to JSON, as it does for inputSchema.");
</script>
</body>
</html>
