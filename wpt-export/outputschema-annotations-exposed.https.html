<!DOCTYPE html>
<html>
<head>
<title>WebMCP: A Tool exposes the outputSchema it was registered with, and annotations with every hint defaulted to false.</title>
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#tool-interface">
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#serialize-a-tool-schema">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Generated by tools/export-wpt.cjs from repros/outputschema-annotations-exposed.json (webmcp-conformance). The expected
// outcomes are those of its Lean model of the spec, at spec commit 14b6d53.
promise_test(async (t) => {
  const controllers = new Map();
  const controller = (n) => {
    if (!controllers.has(n)) controllers.set(n, new AbortController());
    return controllers.get(n);
  };
  const cyclic = () => { const o = {}; o.self = o; return o; };
  t.add_cleanup(() => { for (const c of controllers.values()) c.abort(); });

  // 1. register: the model says ok
  assert_equals(await document.modelContext.registerTool({ name: "a", description: "d", inputSchema: { type: 'object' }, outputSchema: { type: 'object' }, annotations: {"readOnlyHint":true}, execute: async (input) => input }), undefined, 'registerTool() resolves');

  // 2. getTools: the model says tools:a||d|{"type":"object"}|{"type":"object"}|{"readOnlyHint":true,"untrustedContentHint":false,"consequentialHint":false,"debugging":false}
  const tools0 = await document.modelContext.getTools();
  assert_equals(tools0.length, 1, 'getTools() returns 1 tools');
  assert_equals(tools0[0].name, "a");
  assert_equals(tools0[0].title, "");
  assert_equals(tools0[0].description, "d");
  assert_equals(JSON.stringify(tools0[0].inputSchema), "{\"type\":\"object\"}");
  assert_equals(JSON.stringify(tools0[0].outputSchema), "{\"type\":\"object\"}");
  assert_equals(tools0[0].annotations.readOnlyHint, true);
  assert_equals(tools0[0].annotations.untrustedContentHint, false);
  assert_equals(tools0[0].annotations.consequentialHint, false);
  assert_equals(tools0[0].annotations.debugging, false);
}, "A Tool exposes the outputSchema it was registered with, and annotations with every hint defaulted to false.");
</script>
</body>
</html>
