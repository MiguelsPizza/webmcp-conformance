<!DOCTYPE html>
<html>
<head>
<title>WebMCP: A Tool exposes an absent inputSchema, outputSchema and annotations as null, not undefined.</title>
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#tool-interface">
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#serialize-a-tool-schema">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Generated by tools/export-wpt.cjs from repros/absent-members-null.json (webmcp-conformance). The expected
// outcomes are those of its Lean model of the spec, at spec commit 14b6d53.
promise_test(async (t) => {
  const controllers = new Map();
  const controller = (n) => {
    if (!controllers.has(n)) controllers.set(n, new AbortController());
    return controllers.get(n);
  };
  const cyclic = () => { const o = {}; o.self = o; return o; };
  t.add_cleanup(() => { for (const c of controllers.values()) c.abort(); });

  // 1. register: the model says ok
  assert_equals(await document.modelContext.registerTool({ name: "a", description: "d", execute: async (input) => input }), undefined, 'registerTool() resolves');

  // 2. getTools: the model says tools:a||d|null|null|null
  const tools0 = await document.modelContext.getTools();
  assert_equals(tools0.length, 1, 'getTools() returns 1 tools');
  assert_equals(tools0[0].name, "a");
  assert_equals(tools0[0].title, "");
  assert_equals(tools0[0].description, "d");
  assert_equals(tools0[0].inputSchema, null, 'inputSchema is null when absent');
  assert_equals(tools0[0].outputSchema, null, 'outputSchema is null when absent');
  assert_equals(tools0[0].annotations, null, 'annotations is null when absent');
}, "A Tool exposes an absent inputSchema, outputSchema and annotations as null, not undefined.");
</script>
</body>
</html>
