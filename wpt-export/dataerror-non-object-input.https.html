<!DOCTYPE html>
<html>
<head>
<title>WebMCP: Input whose JSON serialization is not an object (here an object whose toJSON() returns 5) makes executeTool() reject with DataError.</title>
<link rel="help" href="https://webmachinelearning.github.io/webmcp/#dom-modelcontext-executetool">
<script src="/resources/testharness.js"></script>
<script src="/resources/testharnessreport.js"></script>
</head>
<body>
<script>
// Generated by tools/export-wpt.cjs from repros/dataerror-non-object-input.json (webmcp-conformance). The expected
// outcomes are those of its Lean model of the spec, at spec commit 14b6d53.
promise_test(async (t) => {
  const controllers = new Map();
  const controller = (n) => {
    if (!controllers.has(n)) controllers.set(n, new AbortController());
    return controllers.get(n);
  };
  const cyclic = () => { const o = {}; o.self = o; return o; };
  t.add_cleanup(() => { for (const c of controllers.values()) c.abort(); });

  // 1. register: the model says ok
  assert_equals(await document.modelContext.registerTool({ name: "a", description: "d", execute: async (input) => input }), undefined, 'registerTool() resolves');

  // 2. getTools: the model says tools:a||d|null|null|null
  const tools0 = await document.modelContext.getTools();
  assert_equals(tools0.length, 1, 'getTools() returns 1 tools');
  assert_equals(tools0[0].name, "a");

  // 3. execute: the model says err:DataError
  await promise_rejects_dom(t, "DataError", document.modelContext.executeTool(tools0[0], { toJSON() { return 5; } }));
}, "Input whose JSON serialization is not an object (here an object whose toJSON() returns 5) makes executeTool() reject with DataError.");
</script>
</body>
</html>
